<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructiva Ingenieros</title>
<style>
body { margin:0; font-family: Arial; }
header { background:#000; color:#fff; padding:15px 30px; display:flex; justify-content:space-between; }
header img { height:45px; }
nav a { color:#fff; margin:0 10px; text-decoration:none; }

.hero { background:#333; color:#fff; text-align:center; padding:80px 20px; }
.btn { background:#25D366; color:#fff; padding:12px 20px; border-radius:8px; text-decoration:none; }

.section { padding:50px 20px; text-align:center; }
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.card { border:1px solid #ddd; padding:20px; border-radius:10px; width:260px; cursor:pointer; }
.card:hover { background:#f5f5f5; }

.gallery img { width:250px; border-radius:10px; }

.modal {
 display:none;
 position:fixed;
 top:0; left:0;
 width:100%; height:100%;
 background:rgba(0,0,0,0.8);
 color:#fff;
 padding:40px;
}
.modal-content { max-width:600px; margin:auto; }
.close { cursor:pointer; color:red; font-size:20px; }

.whatsapp { position:fixed; bottom:20px; right:20px; background:#25D366; color:#fff; padding:15px; border-radius:50%; }
</style>
</head>
<body>

<header>
<div><img src="LOGO.png"></div>
<nav>
<a href="#servicios">Servicios</a>
<a href="#proyectos">Proyectos</a>
</nav>
</header>

<section class="hero">
<h1>CONSTRUCTIVA INGENIEROS</h1>
<p>Ingeniería que transforma espacios</p>
<a class="btn" href="https://wa.me/51900563515">Cotizar</a>
</section>

<section id="servicios" class="section">
<h2>Servicios</h2>
<div class="grid">
<div class="card" onclick="openModal('sanitaria')">Redes Sanitarias</div>
<div class="card" onclick="openModal('tierra')">Movimiento de Tierra</div>
<div class="card" onclick="openModal('topografia')">Topografía</div>
</div>
</section>

<section id="proyectos" class="section">
<h2>Proyectos</h2>
<div class="grid">
<div class="card" onclick="openModal('proyecto1')">Puertas del Sol II</div>
<div class="card" onclick="openModal('proyecto2')">Casa Blanca VII</div>
</div>
</section>

<section class="section gallery">

<div class="grid">
<img src="obra1.jpg">
<img src="obra2.jpg">
<img src="obra3.jpg">
</div>
</section>

<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">X</span>
<p id="contenido"></p>
</div>
</div>

<a class="whatsapp" href="https://wa.me/51900563515">💬</a>

<script>
function openModal(tipo){
 let texto="";

 if(tipo==='sanitaria'){
 texto="Instalación de redes de agua potable y alcantarillado con conexiones domiciliarias según proyectos ejecutados en Chiclayo.";
 }
 if(tipo==='tierra'){
 texto="Movimiento de tierra con maquinaria pesada: excavadoras, rodillos, nivelación y relleno controlado.";
 }
 if(tipo==='topografia'){
 texto="Servicios topográficos con GPS, drones, estaciones totales y geodesia satelital.";
 }
 if(tipo==='proyecto1'){
 texto="Proyecto Puertas del Sol II: instalación de redes sanitarias completas con más de 1800m de tubería.";
 }
 if(tipo==='proyecto2'){
 texto="Proyecto Casa Blanca VII: movimiento de tierra y suministro de maquinaria pesada.";
 }

 document.getElementById('contenido').innerText=texto;
 document.getElementById('modal').style.display='block';
}

function closeModal(){
 document.getElementById('modal').style.display='none';
}
</script>

</body>
</html>
